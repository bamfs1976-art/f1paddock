<!doctype html>
<!-- Source for public/og-image.png. Render with: node scripts/render-og.mjs
     The content is static on purpose: no race name, so the card never goes stale. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; background: #0a0a0a; color: #f5f5f0; overflow: hidden; }
  .wrap { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px; font-family: 'Playfair Display', Georgia, serif; }
  .frame { position: absolute; inset: 24px; border: 2px solid #f5f5f0; pointer-events: none; }
  .diag { position: absolute; left: -200px; width: 1800px; height: 2px; background: linear-gradient(90deg, transparent, #EF0107, transparent); opacity: .35; transform: skewY(-3deg); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .2em; font-size: 20px; color: rgba(245,245,240,.7); }
  h1 { font-size: 104px; line-height: 1.02; margin: 24px 0 0; font-weight: 600; }
  h1 span { color: rgba(245,245,240,.7); font-weight: 500; }
  .rule { width: 220px; height: 6px; background: #EF0107; margin: 32px 0 30px; }
  .tag { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 26px; color: #f5f5f0; letter-spacing: .02em; }
  .foot { position: absolute; left: 80px; right: 80px; top: 536px; display: flex; justify-content: space-between; align-items: center; }
  .foot .mono { font-size: 17px; }
  .dot { display: inline-block; width: 12px; height: 12px; background: #EF0107; border-radius: 50%; margin-right: 12px; vertical-align: middle; }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame"></div>
  <div class="diag" style="top: 150px"></div>
  <div class="diag" style="top: 470px"></div>
  <div class="mono">S 01 // 2026 season · From the paddock</div>
  <h1>F1 Paddock<br><span>Intelligence</span></h1>
  <div class="rule"></div>
  <div class="tag">Live standings · Race weekend data · AI analysis</div>
  <div class="foot">
    <div class="mono"><span class="dot"></span>Hourly from Jolpica and OpenF1</div>
    <div class="mono">fromthepaddock.netlify.app</div>
  </div>
</div>
</body>
</html>
